name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package with test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]

      - name: Compile sources and tests
        run: python -m compileall src tests

      - name: Run unit and MCP runtime tests
        run: python -m unittest discover -s tests
        env:
          PYTHONPATH: src

      - name: Build distribution
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Verify built wheel installs and exposes package data
        run: |
          python -m pip install --no-deps --target "${RUNNER_TEMP}/wheel-check" dist/*.whl
          PYTHONPATH="${RUNNER_TEMP}/wheel-check" python -c "import importlib.resources as r; import mcp_ess_proposal; print(sorted(p.name for p in r.files('mcp_ess_proposal').joinpath('fixtures').iterdir()))"
