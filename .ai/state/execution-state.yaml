dependency_drift:
  type: dependency_declaration_drift
  detected_by: first GitHub CI run, 2026-08-29
  summary: >-
    pyproject declares mcp>=2.0.0, but every local validation ran against mcp
    1.27.2, which does not satisfy that constraint. CI resolved mcp 2.1.1 and the
    low-level Server API used by the adapter does not exist there.
  ci_error: "AttributeError: 'Server' object has no attribute 'list_tools'"
  validated_sdk: 1.27.2
  declared_constraint: ">=2.0.0"
  ci_resolved_sdk: 2.1.1
  impact: >-
    A consumer installing this package per its own metadata receives a
    non-functional server. The declared dependency surface was never validated.
  classification: not_a_pure_ci_config_issue
  options_requiring_human_decision:
    - narrow the declared constraint to the validated 1.x line, which ships a
      package incompatible with the current MCP SDK major version
    - migrate the server adapter to the mcp 2.x low-level API, which is a code
      change at the MCP boundary and needs full schema-fidelity revalidation
  related_gap: GAP-014 validation environment provenance
  resolution:
    human_decisions:
      - >-
        Migrate MCP Server Adapter to MCP SDK 2.x low-level API and constrain
        dependency to mcp>=2.1,<3.
      - >-
        Permit only top-level type: object output schema normalization required
        by MCP 2.1.1 tools/list; success and error branches remain unchanged.
    implemented:
      - pyproject dependency constrained to mcp>=2.1,<3.
      - src/mcp_ess_proposal/server.py uses add_request_handler for tools/list and tools/call.
      - Runtime discovery output schema adds only root type: object over the accepted oneOf branches.
      - CONTRACT AMENDMENT-0002 records the normalization rule and fidelity split.
    executed_tests:
      - Python 3.11 clean environment installed mcp 2.1.1 and package dev dependencies.
      - python -m compileall src tests PASS.
      - python -m unittest discover -s tests PASS, 58 tests.
      - targeted schema semantic-equivalence and payload validation tests PASS.
      - stdio ClientSession tools/list and tools/call tests PASS.
      - wheel and sdist build PASS.
      - fresh wheel install with mcp 2.1.1 PASS.
      - installed-wheel stdio smoke for 600 kWh plus tariff 0.60 and inconsistent input PASS.
      - release safety gate PASS.
    blocked:
      - >-
        Claude Code Host E2E could not run because local Claude auth is absent:
        claude auth status reports loggedIn false / authMethod none, and claude -p
        returns API 403 before any MCP tool call.
    not_run:
      - Claude Host E2E on MCP 2.x, blocked by host authentication.
      - GitHub CI rerun result, not observable from this session after push.
recommended_next_action: >-
  Observe GitHub CI with authenticated GitHub access and rerun true Claude Host
  E2E under MCP 2.x with a logged-in Claude host. Do not mark Release Candidate
  Ready until both pass. No tag, release, registry publish, or public
